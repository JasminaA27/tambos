<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rones - Licorería Tambos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f9f9f9; }
    .navbar { background: linear-gradient(135deg, #000000, #8B0000); }
    .navbar-brand, .nav-link { color: #fff !important; }
    .sidebar {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 20px;
      height: fit-content;
    }
    .sidebar h5 { color: #8B0000; font-weight: bold; }
    .product-card {
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: 0.3s;
      background: #fff;
    }
    .product-card:hover { transform: translateY(-5px); }
    .product-info { padding: 15px; }
    .btn-carrito { background: #C41E3A; color: white; border: none; transition: 0.3s; }
    .btn-carrito:hover { background: #8B0000; }
    footer {
      background: linear-gradient(135deg, #000000, #8B0000);
      color: white;
      padding: 30px 0;
      text-align: center;
      margin-top: 60px;
    }
  </style>
</head>
<body>

  <!-- 🔝 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="fas fa-wine-bottle"></i> TAMBOS</a>
      <div class="ms-auto">
        <a class="nav-link" href="carrito.html">🛒 <span id="contadorCarrito" class="badge bg-danger">0</span></a>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row">
      
      <!-- 🧭 Sidebar de filtro -->
      <div class="col-md-3 mb-4">
        <div class="sidebar">
          <h5>Filtrar por marca</h5>
          <select class="form-select mt-3" id="marcaFiltro">
            <option value="todos">Todos los rones</option>
            <option value="Bacardi">Bacardi</option>
            <option value="Cartavio">Cartavio</option>
            <option value="Flor de Caña">Flor de Caña</option>
          </select>
        </div>
      </div>

      <!-- 🧾 Lista de productos -->
      <div class="col-md-9">
        <h2 class="text-center mb-4 text-dark">Rones disponibles</h2>
        <div class="row" id="listaProductos"></div>
      </div>

    </div>
  </div>

  <footer>
    <p>&copy; 2025 Licorería Tambos | Todos los derechos reservados.</p>
  </footer>

  <script>
    const productos = [
      { id: 1, nombre: "Ron Bacardi Blanco", marca: "Bacardi", img: "https://images.unsplash.com/photo-1609428035459-58d9d47f9d87", precioBase: 40 },
      { id: 2, nombre: "Ron Cartavio 5 años", marca: "Cartavio", img: "https://images.unsplash.com/photo-1617131206637-cd5d8eebdd6b", precioBase: 55 },
      { id: 3, nombre: "Ron Flor de Caña 7 años", marca: "Flor de Caña", img: "https://images.unsplash.com/photo-1606787366850-de6330128bfc", precioBase: 70 }
    ];

    const contenedor = document.getElementById('listaProductos');
    const filtroMarca = document.getElementById('marcaFiltro');

    function mostrarProductos(filtro = 'todos') {
      contenedor.innerHTML = '';
      productos.filter(p => filtro === 'todos' || p.marca === filtro)
      .forEach(prod => {
        contenedor.innerHTML += `
          <div class="col-md-4 mb-4">
            <div class="product-card">
              <img src="${prod.img}" class="card-img-top" style="height:250px;object-fit:cover;">
              <div class="product-info">
                <h5>${prod.nombre}</h5>
                <p><strong>Marca:</strong> ${prod.marca}</p>
                <label class="form-label">Tamaño:</label>
                <select class="form-select form-select-sm" id="ml-${prod.id}" onchange="actualizarPrecio(${prod.id}, this.value)">
                  <option value="300">300 ml - S/ ${(prod.precioBase * 0.5).toFixed(2)}</option>
                  <option value="750" selected>750 ml - S/ ${prod.precioBase.toFixed(2)}</option>
                  <option value="1000">1 L - S/ ${(prod.precioBase * 1.3).toFixed(2)}</option>
                </select>
                <p id="precio-${prod.id}" class="mt-2 fw-bold text-danger">Precio: S/ ${prod.precioBase.toFixed(2)}</p>
                <button class="btn btn-carrito w-100 mt-2" onclick="agregarCarrito(${prod.id})">
                  <i class="fas fa-cart-plus"></i> Agregar al carrito
                </button>
              </div>
            </div>
          </div>`;
      });
    }

    function actualizarPrecio(id, ml) {
      const producto = productos.find(p => p.id === id);
      let nuevoPrecio = producto.precioBase;
      if (ml == 300) nuevoPrecio *= 0.5;
      if (ml == 1000) nuevoPrecio *= 1.3;
      document.getElementById(`precio-${id}`).textContent = `Precio: S/ ${nuevoPrecio.toFixed(2)}`;
    }

    function agregarCarrito(id) {
      const producto = productos.find(p => p.id === id);
      const ml = document.getElementById(`ml-${id}`).value;
      let precio = producto.precioBase;
      if (ml == 300) precio *= 0.5;
      if (ml == 1000) precio *= 1.3;

      let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      carrito.push({ ...producto, ml, precio, cantidad: 1 });
      localStorage.setItem("carrito", JSON.stringify(carrito));

      actualizarContador();
      alert(`✅ ${producto.nombre} (${ml} ml) agregado al carrito`);
    }

    function actualizarContador() {
      let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
      document.getElementById("contadorCarrito").textContent = carrito.length;
    }

    filtroMarca.addEventListener('change', e => mostrarProductos(e.target.value));
    mostrarProductos();
    actualizarContador();
  </script>
</body>
</html>
